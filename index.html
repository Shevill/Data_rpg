<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data RPG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);min-height:100vh;color:#e2e8f0;padding:16px}
.app{max-width:480px;margin:0 auto}
.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:16px;backdrop-filter:blur(12px);padding:16px;margin-bottom:12px}
.card-purple{background:linear-gradient(135deg,rgba(139,92,246,0.15),rgba(109,40,217,0.1));border-color:rgba(139,92,246,0.3)}
.card-blue{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.3)}
.card-green{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.3)}
.card-amber{background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3)}
.card-red{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4)}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.1rem;font-weight:600;margin-bottom:12px}
h3{font-size:0.95rem;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:0.72rem;font-weight:600}
.badge-purple{background:rgba(139,92,246,0.25);color:#c4b5fd}
.badge-amber{background:rgba(245,158,11,0.2);color:#fcd34d}
.badge-green{background:rgba(16,185,129,0.2);color:#6ee7b7}
.badge-blue{background:rgba(59,130,246,0.2);color:#93c5fd}
.badge-red{background:rgba(239,68,68,0.2);color:#fca5a5}
.badge-gray{background:rgba(255,255,255,0.1);color:#94a3b8}
.xp-bar-wrap{background:rgba(255,255,255,0.08);border-radius:8px;height:8px;overflow:hidden;margin:6px 0}
.xp-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#8b5cf6,#06b6d4);transition:width 0.5s ease}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-size:0.88rem;font-weight:600;transition:all 0.15s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(139,92,246,0.4)}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.btn-green:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(16,185,129,0.4)}
.btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-red:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(239,68,68,0.4)}
.btn-ghost{background:rgba(255,255,255,0.07);color:#94a3b8;border:1px solid rgba(255,255,255,0.1)}
.btn-ghost:hover{background:rgba(255,255,255,0.12);color:#e2e8f0}
.btn-sm{padding:6px 12px;font-size:0.8rem}
.btn-full{width:100%}
.track-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.track-card{border-radius:14px;padding:14px;cursor:pointer;transition:transform 0.15s;border:1px solid transparent}
.track-card:hover{transform:translateY(-2px)}
.track-card.locked{opacity:0.45;cursor:not-allowed}
.track-card .track-emoji{font-size:1.6rem;margin-bottom:4px}
.track-card .track-name{font-size:0.88rem;font-weight:700;margin-bottom:2px}
.track-card .track-sub{font-size:0.7rem;color:#94a3b8;margin-bottom:6px}
.track-card .track-prog{font-size:0.72rem;color:#64748b}
.progress-bar{background:rgba(255,255,255,0.08);border-radius:4px;height:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px;transition:width 0.4s}
.quest-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);margin-bottom:6px;cursor:pointer;transition:all 0.15s}
.quest-item:hover{background:rgba(255,255,255,0.08)}
.quest-item.boss{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)}
.quest-item.completed{border-color:rgba(16,185,129,0.25)}
.quest-status{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.quest-emoji{font-size:1.1rem;flex-shrink:0}
.quest-info{flex:1;min-width:0}
.quest-title{font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest-meta{font-size:0.72rem;color:#64748b;margin-top:2px}
.steps-indicator{display:flex;align-items:center;gap:4px;margin:16px 0}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0}
.step-dot.done{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.step-dot.active{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 0 12px rgba(139,92,246,0.5)}
.step-dot.pending{background:rgba(255,255,255,0.08);color:#475569}
.step-line{flex:1;height:2px;background:rgba(255,255,255,0.08);border-radius:2px}
.step-line.done{background:linear-gradient(90deg,#10b981,#059669)}
.step-type-badge{font-size:0.7rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-bottom:8px;display:inline-block}
.step-type-theory{background:rgba(59,130,246,0.2);color:#93c5fd}
.step-type-code{background:rgba(245,158,11,0.2);color:#fcd34d}
.step-type-task{background:rgba(139,92,246,0.2);color:#c4b5fd}
.step-type-recall{background:rgba(16,185,129,0.2);color:#6ee7b7}
pre{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px;overflow-x:auto;font-size:0.75rem;line-height:1.5;margin:8px 0;white-space:pre-wrap;word-break:break-word}
code{font-family:'JetBrains Mono','Fira Code','Courier New',monospace}
.desc-text{font-size:0.85rem;line-height:1.6;color:#cbd5e1;white-space:pre-wrap}
.review-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5);opacity:0;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;font-size:1.4rem;font-weight:800;padding:14px 28px;border-radius:16px;pointer-events:none;z-index:1000;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.xp-popup.show{transform:translate(-50%,-100%) scale(1);opacity:1}
.xp-popup.hide{transform:translate(-50%,-140%) scale(0.8);opacity:0;transition:all 0.3s ease}
.section-title{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#475569;margin-bottom:8px;margin-top:16px}
.header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.back-btn{display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:0.85rem;cursor:pointer;padding:4px 8px;border-radius:8px;transition:all 0.15s}
.back-btn:hover{color:#e2e8f0;background:rgba(255,255,255,0.07)}
.review-card{text-align:center;padding:20px}
.completion-card{text-align:center;padding:20px}
.big-emoji{font-size:3rem;margin-bottom:8px}
.review-progress{font-size:0.8rem;color:#64748b;text-align:center;margin-top:8px}
.due-list{display:flex;flex-direction:column;gap:4px}
.due-item{font-size:0.82rem;color:#94a3b8;padding:4px 0;display:flex;align-items:center;gap:6px}
.reset-btn{font-size:0.72rem;color:#475569;background:none;border:none;cursor:pointer;margin-top:8px;text-decoration:underline}
.reset-btn:hover{color:#94a3b8}
.hero-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hero-emoji{font-size:2.4rem}
.hero-info{flex:1}
.hero-name{font-size:1.1rem;font-weight:700;color:#e2e8f0}
.hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.xp-label{display:flex;justify-content:space-between;font-size:0.72rem;color:#64748b;margin-bottom:2px}
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.step-preview{opacity:0.4;padding:8px 10px;border-radius:8px;font-size:0.8rem;margin-bottom:4px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
.code-editor{width:100%;min-height:130px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px;font-family:'SF Mono','Fira Code','JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:#86efac;resize:vertical;outline:none;tab-size:4;white-space:pre}
.code-editor:focus{border-color:rgba(139,92,246,0.5);box-shadow:0 0 0 2px rgba(139,92,246,0.15)}
.run-output{background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 12px;font-family:'SF Mono','Fira Code',monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;margin:8px 0;max-height:220px;overflow-y:auto;overflow-x:auto}
.run-output.ok{color:#86efac}.run-output.err{color:#fca5a5}.run-output.loading{color:#94a3b8;font-style:italic}
.sql-table{width:100%;border-collapse:collapse;font-size:11px}
.sql-table th{background:rgba(16,185,129,0.2);color:#6ee7b7;padding:5px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.1);white-space:nowrap}
.sql-table td{color:#cbd5e1;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.05);white-space:nowrap}
.sql-table tr:last-child td{border-bottom:none}
.run-bar{display:flex;gap:8px;margin:8px 0 4px}
.recall-q{margin-bottom:7px;border-radius:10px;border:1px solid rgba(16,185,129,0.18);overflow:hidden;background:rgba(16,185,129,0.02)}
.recall-q-row{padding:9px 12px;display:flex;gap:8px;align-items:flex-start}
.recall-q-num{color:#10b981;font-weight:700;font-size:13px;flex-shrink:0;margin-top:2px}
.recall-q-text{font-size:13px;color:#e2e8f0;flex:1;line-height:1.5}
.recall-toggle{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.25);border-radius:6px;color:#10b981;font-size:11px;padding:3px 9px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.recall-ans{display:none;padding:8px 12px 10px;background:rgba(16,185,129,0.07);border-top:1px solid rgba(16,185,129,0.12);font-size:12px;color:#6ee7b7;line-height:1.65}
.recall-voice-ta{width:100%;margin-top:6px;min-height:56px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 10px;font-size:12px;color:#e2e8f0;resize:vertical;outline:none;font-family:inherit}
.recall-voice-ta:focus{border-color:rgba(139,92,246,0.4)}
.ai-out{display:none;margin-top:6px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.25);border-radius:8px;padding:10px 12px;font-size:12px;color:#c4b5fd;line-height:1.6;white-space:pre-wrap}
.ai-out.approved{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.35);color:#86efac;display:block}
.ai-out.rejected{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.3);color:#fca5a5;display:block}
.sql-cells{display:flex;flex-direction:column;gap:8px}
.sql-cell{border:1px solid rgba(16,185,129,0.2);border-radius:10px;overflow:hidden;background:rgba(16,185,129,0.03)}
.sql-cell-bar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:rgba(16,185,129,0.08);border-bottom:1px solid rgba(16,185,129,0.15)}
.sql-cell-label{font-size:11px;font-weight:700;color:#10b981;flex:1}
.sql-cell .code-editor{border:none;border-radius:0;background:rgba(0,0,0,0.4);min-height:72px}
.sql-cell .run-output{margin:0;border-radius:0;border:none;border-top:1px solid rgba(255,255,255,0.06)}
.py-cells{display:flex;flex-direction:column;gap:8px}
.py-cell{border:1px solid rgba(59,130,246,0.2);border-radius:10px;overflow:hidden;background:rgba(59,130,246,0.03)}
.py-cell-bar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:rgba(59,130,246,0.08);border-bottom:1px solid rgba(59,130,246,0.15)}
.py-cell-label{font-size:11px;font-weight:700;color:#60a5fa;flex:1;font-family:'SF Mono','Fira Code',monospace}
.py-cell .code-editor{border:none;border-radius:0;background:rgba(0,0,0,0.4);min-height:80px}
.py-cell .run-output{margin:0;border-radius:0;border:none;border-top:1px solid rgba(255,255,255,0.06)}
</style>
</head>
<body>
<button id="lang-btn" style="position:fixed;top:12px;right:12px;z-index:500;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#94a3b8;backdrop-filter:blur(8px);letter-spacing:1px">EN</button>
<div class="app" id="app"></div>
<div id="xp-popup" class="xp-popup"></div>
<div id="confetti-container" class="confetti-container"></div>
<script src="js/config.js"></script>
<script src="js/quests-python.js"></script>
<script src="js/quests-sql.js"></script>
<script src="js/quests-ds.js"></script>
<script src="js/quests-ml.js"></script>
<script src="js/quests-cv.js"></script>
<script src="js/quests-en.js"></script>
<script src="js/state.js"></script>
<script src="js/lang.js"></script>
<script src="js/render.js"></script>
<script src="js/runner.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>
</body>
</html>
